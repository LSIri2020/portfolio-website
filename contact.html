<body>
  <header class="header">
    <a href="index.html" class="logo">Rima.dev</a>

  <main class="page contact">

  <section class="contact-form-wrap">
    <h1 class="page-title">Contactez-moi</h1>

    <form id="contactForm" class="contact-form" novalidate>
      <div class="form-group">
        <label for="nom">Nom</label>
        <input type="text" id="nom" placeholder="Votre nom" required>
        <small class="error"></small>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="vous@email.com" required>
        <small class="error"></small>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" placeholder="Votre message" required></textarea>
        <small class="error"></small>
      </div>

      <button type="submit" class="btn btn-primary">Envoyer le message</button>
      <p id="formSuccess" class="form-success"></p>
    </form>
  </section>

  <aside class="contact-info">
    <h2>Autres moyens</h2>
    <p>Email : rimawerteteni21@gmail.com</p>
    <p>LinkedIn : /https://www.linkedin.com/in/rima-werteteni-3aa387272/</p>
    <p>GitHub : https://github.com/LSIri2020</p>
  </aside>

</main>
